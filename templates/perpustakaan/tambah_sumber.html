{% extends 'base.html' %}
{% block title %}Tambah Koleksi{% endblock %}
{% block page_title %}Tambah Koleksi ke {{ zona.nama }}{% endblock %}
{% block content %}
<div class="max-w-lg">
<div class="mb-4"><a href="{% url 'perpustakaan:detail_zona' zona.id %}" class="text-sm text-[#0B3D26] hover:underline">&larr; Kembali ke {{ zona.nama }}</a></div>
<div class="card p-6">
  <form method="POST" enctype="multipart/form-data" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Judul</label>
      <input type="text" name="judul" required class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Jenis</label>
      <select name="jenis" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
        <option value="TEKS">E-Book / Teks</option>
        <option value="AUDIO">Audiobook</option>
        <option value="VIDEO">Video</option>
      </select>
    </div>
    <div>
      <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Deskripsi</label>
      <textarea name="deskripsi" rows="3" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm"></textarea>
    </div>
    <div>
      <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Cover (gambar, opsional)</label>
      <input type="file" name="cover" accept="image/*" class="w-full text-sm">
    </div>
    <div>
      <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">File (PDF/audio, opsional kalau pakai link)</label>
      <input type="file" name="file" class="w-full text-sm">
    </div>
    <div>
      <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Link Video/Audio (opsional)</label>
      <input type="url" name="link_url" placeholder="https://youtube.com/watch?v=..." class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Lencana Hadiah (opsional)</label>
      <select name="lencana_hadiah" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
        <option value="">Tidak ada</option>
        {% for l in lencana_list %}<option value="{{ l.id }}">{{ l.ikon }} {{ l.nama }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Teks untuk Dibacakan (Audiobook, opsional)</label>
      <textarea name="teks_baca" rows="8" placeholder="Tempel atau ketik isi cerita di sini. Suara akan membacakannya untuk anak." class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm"></textarea>
    </div>
    <div class="flex gap-3 pt-2">
      <button type="submit" class="btn-primary">Simpan</button>
      <a href="{% url 'perpustakaan:detail_zona' zona.id %}" class="btn-secondary">Batal</a>
    </div>
  </form>
</div>
</div>
{% endblock %}
