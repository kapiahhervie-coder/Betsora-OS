{% extends 'base.html' %}
{% block title %}Zona Baru{% endblock %}
{% block page_title %}Buat Zona Baru{% endblock %}
{% block content %}
<div class="max-w-lg">
<div class="mb-4"><a href="{% url 'perpustakaan:peta' %}" class="text-sm text-[#0B3D26] hover:underline">&larr; Kembali</a></div>
<div class="card p-6">
  <form method="POST" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Nama Zona</label>
      <input type="text" name="nama" required placeholder="Contoh: Puncak Sains dan Antariksa" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Ikon (tempel emoji di sini, opsional)</label>
      <input type="text" name="ikon" maxlength="10" placeholder="Contoh: paste emoji roket" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Warna Latar</label>
      <input type="color" name="warna" value="#0B3D26" class="w-full border border-gray-200 rounded-lg h-10">
    </div>
    <div>
      <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Deskripsi (opsional)</label>
      <textarea name="deskripsi" rows="3" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm"></textarea>
    </div>
    <div class="flex gap-3 pt-2">
      <button type="submit" class="btn-primary">Buat Zona</button>
      <a href="{% url 'perpustakaan:peta' %}" class="btn-secondary">Batal</a>
    </div>
  </form>
</div>
</div>
{% endblock %}
