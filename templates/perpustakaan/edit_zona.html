{% extends 'base.html' %}
{% block title %}Edit Zona{% endblock %}
{% block page_title %}Edit Zona{% endblock %}
{% block content %}
<div class="max-w-lg">
<div class="mb-4"><a href="{% url 'perpustakaan:detail_zona' zona.id %}" class="text-sm text-[#0B3D26] hover:underline">&larr; Kembali</a></div>
<div class="card p-6">
  <form method="POST" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Nama Zona</label>
      <input type="text" name="nama" value="{{ zona.nama }}" required maxlength="100" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Ikon (tempel emoji, opsional)</label>
      <input type="text" name="ikon" value="{{ zona.ikon }}" maxlength="10" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">
    </div>
    <div>
      <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Warna Latar</label>
      <input type="color" name="warna" value="{{ zona.warna }}" class="w-full border border-gray-200 rounded-lg h-10">
    </div>
    <div>
      <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Deskripsi (opsional)</label>
      <textarea name="deskripsi" rows="3" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm">{{ zona.deskripsi }}</textarea>
    </div>
    <div class="flex gap-3 pt-2">
      <button type="submit" class="btn-primary">Simpan Perubahan</button>
      <a href="{% url 'perpustakaan:detail_zona' zona.id %}" class="btn-secondary">Batal</a>
    </div>
  </form>
</div>
</div>
{% endblock %}
