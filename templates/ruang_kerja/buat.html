{% extends 'base.html' %}
{% block title %}Buat Ruang Kerja{% endblock %}
{% block page_title %}Buat Ruang Kerja{% endblock %}
{% block content %}
<div class="max-w-lg">
<div class="mb-4" style="display:flex; justify-content:space-between; align-items:center;">
  <a href="{% url 'ruang_kerja:daftar' %}" class="text-sm text-[#3C8C1F] hover:underline">← Kembali</a>
  <a href="{% url 'ruang_kerja:kelola_mapel' %}" class="text-sm text-[#3C8C1F] hover:underline">⚙️ Kelola Mata Pelajaran</a>
</div>
<div class="card p-6">
  <form method="POST" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Mata Pelajaran</label>
      <select name="mapel" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm" required>
        {% for m in mapel_list %}<option value="{{ m.nama }}">{{ m.nama }}</option>{% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Kelas</label>
      <input type="text" name="kelas" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm" placeholder="Contoh: 3, 4A, Kelompok Pagi" required>
    </div>
    <div>
      <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Deskripsi (opsional)</label>
      <textarea name="deskripsi" rows="3" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm" placeholder="Tentang ruang kerja ini"></textarea>
    </div>
    <div class="flex gap-3 pt-2">
      <button type="submit" class="btn-primary">Buat Ruang Kerja</button>
      <a href="{% url 'ruang_kerja:daftar' %}" class="btn-secondary">Batal</a>
    </div>
  </form>
</div>
</div>
{% endblock %}
