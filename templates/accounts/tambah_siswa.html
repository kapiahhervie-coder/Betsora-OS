{% extends 'base.html' %}
{% block title %}Tambah Siswa{% endblock %}
{% block page_title %}Tambah Siswa{% endblock %}
{% block content %}
<div class="max-w-lg">
<div class="mb-4"><a href="{% url 'accounts:daftar_siswa' %}" class="text-sm text-green-700 hover:underline">← Kembali</a></div>
<div class="card p-6">
  <form method="POST" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Nama Lengkap</label>
      <input name="nama" required class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="Nama lengkap siswa">
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">NIS</label>
        <input name="nis" required class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="Nomor induk siswa">
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Kelas</label>
        <input name="kelas" required class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="cth: 8A">
      </div>
    </div>
    <div>
      <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">No. HP Orang Tua</label>
      <input name="no_ortu" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="cth: 08123456789">
    </div>
    <div>
      <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Alamat</label>
      <textarea name="alamat" rows="2" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="Alamat rumah (opsional)"></textarea>
    </div>
    <div class="flex gap-3 pt-2">
      <button type="submit" class="btn-primary">Simpan Siswa</button>
      <a href="{% url 'accounts:daftar_siswa' %}" class="btn-secondary">Batal</a>
    </div>
  </form>
</div>
</div>
{% endblock %}
