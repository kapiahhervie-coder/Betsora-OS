<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — {{ pengaturan.nama_institusi }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Lora:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Inter', sans-serif; }
  .font-serif { font-family: 'Lora', serif; }
</style>
</head>
<body class="min-h-screen bg-[#3C8C1F] flex items-center justify-center">
<div class="w-full max-w-sm">
  <div class="text-center mb-7">
   <p class="font-serif text-[#F4EFE4] text-[24px]">{{ pengaturan.nama_institusi }}</p>
    <p class="text-[#B7DFA0] text-[12px] mt-1 tracking-wide uppercase">{{ pengaturan.sub_judul|default:"SMP Negeri 1 Contoh" }}</p>
  </div>
  <div class="bg-white rounded-2xl shadow-xl p-8">
    {% if messages %}
      {% for msg in messages %}
      <div class="bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 text-sm mb-4">{{ msg }}</div>
      {% endfor %}
    {% endif %}
    <form method="POST">
      {% csrf_token %}
      <div class="space-y-4">
        <div>
          <label class="block text-[13px] font-medium text-gray-700 mb-1.5">Username</label>
          <input name="username" type="text" required class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#3C8C1F] focus:border-[#3C8C1F]">
        </div>
        <div>
          <label class="block text-[13px] font-medium text-gray-700 mb-1.5">Password</label>
          <input name="password" type="password" required class="w-full border border-gray-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#3C8C1F] focus:border-[#3C8C1F]">
        </div>
        <button type="submit" class="w-full bg-[#3C8C1F] text-white rounded-lg py-2.5 text-sm font-medium hover:bg-[#4FA82E] transition mt-2">Masuk</button>
      </div>
    </form>
  </div>
  <p class="text-center text-[#82B85F] text-[12px] mt-6">Platform internal — hanya untuk guru dan staf</p>
</div>
</body>
</html>
